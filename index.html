<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#D32F2F">
<meta name="description" content="E-Juku - Platform pesan online hasil laut segar.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="E-Juku">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>E-Juku — Platform Pesan Online Hasil Laut</title>
<link rel="icon" type="image/png" href="logoejuku.png">
<link rel="apple-touch-icon" href="logoejuku.png">
<link rel="preconnect" href="https://unpkg.com" crossorigin>
<link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin>
<link rel="preconnect" href="https://images.unsplash.com" crossorigin>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="splash" aria-hidden="true">
  <img src="logoejuku.png" alt="E-Juku" onerror="this.style.display='none'">
  <h1>E-Juku</h1>
  <p>Dari Laut ke Meja</p>
  <div class="spinner"></div>
</div>

<div id="app"></div>
<div id="toast" class="toast" role="alert" aria-live="polite"></div>

<noscript>
  <div style="position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:system-ui,sans-serif;z-index:99999">
    <div>
      <h2 style="color:#D32F2F;margin:0 0 8px;font-size:20px">JavaScript Diperlukan</h2>
      <p style="color:#666;font-size:14px;margin:0">Aktifkan JavaScript untuk menggunakan E-Juku.</p>
    </div>
  </div>
</noscript>

<style>
  #splash{position:fixed;inset:0;z-index:9999;
    background:linear-gradient(160deg,#D32F2F 0%,#B71C1C 60%,#7F1010 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    transition:opacity .35s ease}
  #splash img{width:96px;height:96px;object-fit:contain;background:#fff;border-radius:22px;padding:10px;
    box-shadow:0 12px 32px rgba(0,0,0,.25);animation:pop .5s ease}
  #splash h1{color:#fff;font-size:28px;font-weight:900;letter-spacing:-.6px;margin:16px 0 4px;
    font-family:system-ui,-apple-system,sans-serif}
  #splash p{color:rgba(255,255,255,.85);font-size:12px;margin:0;
    font-family:system-ui,-apple-system,sans-serif;letter-spacing:.3px}
  #splash .spinner{margin-top:28px;width:34px;height:34px;border-radius:50%;
    border:3px solid rgba(255,255,255,.25);border-top-color:#fff;animation:spin .9s linear infinite}
  #splash.hide{opacity:0;pointer-events:none}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
</style>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="app.js"></script>
<script>
  (function(){
    var hidden=false;
    function hide(){ if(hidden)return; hidden=true; var s=document.getElementById('splash'); if(!s)return;
      s.classList.add('hide'); setTimeout(function(){ if(s.parentNode) s.parentNode.removeChild(s); },400); }
    if(document.readyState==='complete'){ setTimeout(hide,250); }
    else { window.addEventListener('load', function(){ setTimeout(hide,250); }); }
    setTimeout(hide,3000);
  })();
</script>
</body>
</html>
